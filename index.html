<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>奶龙跳舞 🐉</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:linear-gradient(160deg,#ffe9f3 0%,#fff3d1 45%,#d9f1ff 100%);background-size:200% 200%;animation:bg 12s ease-in-out infinite;display:flex;align-items:center;justify-content:center;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none}
  @keyframes bg{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
  h1{position:absolute;top:3vh;margin:0;font-size:clamp(22px,5vw,40px);color:#e8913a;text-shadow:0 2px 0 #fff,0 4px 10px #ffd08a;letter-spacing:4px}
  .hint{position:absolute;bottom:3vh;text-align:center;color:#c9854a;font-size:14px;opacity:.85}
  .float{position:absolute;bottom:-10%;font-size:28px;pointer-events:none;animation:up linear forwards}
  @keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}
    /* dance (official 3D artwork, animated with transforms + pose switching) */
  #stage{position:relative;height:min(64vh,560px);aspect-ratio:356/450;margin-top:4vh}
  #shadow{position:absolute;left:50%;bottom:-2%;width:70%;height:7%;margin-left:-35%;border-radius:50%;background:radial-gradient(closest-side,rgba(138,90,26,.38),rgba(138,90,26,0));will-change:transform,opacity}
  #hop{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
  #belly{position:absolute;inset:0;transform-origin:50% 72%;will-change:transform}
  #belly img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 6px 8px rgba(190,120,20,.25))}
  #belly img.on{opacity:1}
  #sound{position:absolute;top:2vh;right:3vw;font-size:26px;cursor:pointer;background:#fff8;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;z-index:5}
</style>
</head>
<body>
<h1>奶龙跳舞 🐉</h1>
<div id="sound" title="开/关声音">🔇</div>
<div id="stage" aria-label="奶龙在跳舞">
  <div id="shadow"></div>
  <div id="hop"><div id="belly">
    <img src="assets/nailong_pose1_armsup.png" alt="奶龙" class="on">
    <img src="assets/nailong_pose2_wave.png" alt="">
    <img src="assets/nailong_pose3_hello.png" alt="">
    <img src="assets/nailong_pose4_happy.png" alt="">
  </div></div>
</div>
<div class="hint">点一下屏幕，听奶龙打拍子 ♪<br><small style="opacity:.7;font-size:11px">奶龙形象版权归第七印象所有，本页为粉丝趣味小站</small></div>
<script>
// floating decorations
const sym=['⭐','🎵','♥','✨','🎶','💛','★'];
function spawn(){
  const e=document.createElement('div');e.className='float';
  e.textContent=sym[Math.random()*sym.length|0];
  e.style.left=Math.random()*96+'vw';
  e.style.fontSize=(18+Math.random()*26)+'px';
  e.style.animationDuration=(6+Math.random()*6)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),12500);
}
setInterval(spawn,450);for(let i=0;i<8;i++)setTimeout(spawn,i*120);

// WebAudio beat (muted by default; click toggles)
let ctx=null,on=false,timer=null,step=0;
const btn=document.getElementById('sound');
function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d)}
const melody=[523,659,784,659,523,659,784,1047];
function tick(){const t=ctx.currentTime+.02;
  // kick on beat
  const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.2);
  tone(melody[step%8],t,.25,'triangle',.18);step++}
function toggle(e){
  if(e)e.stopPropagation();
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  on=!on;btn.textContent=on?'🔊':'🔇';
  if(on){ctx.resume();step=0;tick();timer=setInterval(tick,300)}else{clearInterval(timer)}
}
document.body.addEventListener('click',()=>{ if(!on) toggle(); });
btn.addEventListener('click',toggle);

// ---- dance: one hop per beat (600ms), pose switches on every half beat ----
const BEAT=600, seq=[0,1,3,2,0,2,3,1];   // pose order, one entry per half beat
const imgs=[...document.querySelectorAll('#belly img')];
const hop=document.getElementById('hop'),belly=document.getElementById('belly'),shadow=document.getElementById('shadow');
const frozen=new URLSearchParams(location.search).get('t');   // ?t=ms freezes the animation (for screenshots)
let cur=0;
function render(ms){
  const p=(ms%BEAT)/BEAT;                       // 0..1 inside a beat
  const air=Math.sin(Math.PI*p);                // 0 on the ground, 1 at the peak
  const k=Math.floor(ms/BEAT);                  // beat counter
  const dir=(k%2?1:-1);
  // squash on landing / stretch in the air
  const land=Math.pow(1-air,6), sy=1+0.07*air-0.13*land, sx=1-0.05*air+0.12*land;
  const y=-air*46;
  const rot=dir*(4-8*p)*(1);                    // sway left/right, swing across each beat
  hop.style.transform=`translateY(${y}px) rotate(${rot}deg) scale(${sx},${sy})`;
  // belly bounce: pulses on the beat
  const b=Math.pow(Math.max(0,Math.cos(2*Math.PI*p)),3);
  belly.style.transform=`scale(${1+0.035*b},${1-0.045*b})`;
  shadow.style.transform=`scale(${1-0.28*air})`;shadow.style.opacity=1-0.45*air;
  const f=seq[Math.floor(ms/(BEAT/2))%seq.length];
  if(f!==cur){imgs[cur].classList.remove('on');imgs[f].classList.add('on');cur=f}
}
if(frozen!==null){render(+frozen)}
else if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(0)}
else{const t0=performance.now();(function loop(now){render(now-t0);requestAnimationFrame(loop)})(t0)}

</script>
</body>
</html>
