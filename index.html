<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小黄龙跳舞 🐉</title>
<style>
  :root{--beat:631.579ms}   /* 95 BPM */
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:linear-gradient(160deg,#ffe9f3 0%,#fff3d1 45%,#d9f1ff 100%);background-size:200% 200%;animation:bg 12s ease-in-out infinite;display:flex;align-items:center;justify-content:center;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none}
  @keyframes bg{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
  h1{position:absolute;top:3vh;margin:0;font-size:clamp(22px,5vw,40px);color:#e8913a;text-shadow:0 2px 0 #fff,0 4px 10px #ffd08a;letter-spacing:4px}
  #stage{width:min(92vw,78vh,640px);height:min(92vw,78vh,640px);position:relative}
  svg{width:100%;height:100%;overflow:visible}
  .hint{position:absolute;bottom:3vh;text-align:center;color:#c9854a;font-size:14px;opacity:.85}
  .float{position:absolute;bottom:-10%;font-size:28px;pointer-events:none;animation:up linear forwards}
  @keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}
  /* dance */
  #all{transform-origin:300px 520px;animation:hop calc(var(--beat)*2) ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(-5deg)}25%{transform:translateY(-34px) rotate(0)}50%{transform:translateY(0) rotate(5deg)}75%{transform:translateY(-34px) rotate(0)}}
  #body{transform-origin:300px 500px;animation:sway calc(var(--beat)*2) ease-in-out infinite}
  @keyframes sway{0%,100%{transform:scale(1.03,.96)}50%{transform:scale(.97,1.04)}}
  #head{transform-origin:300px 410px;animation:nod calc(var(--beat)*2) ease-in-out infinite}
  @keyframes nod{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  #armL{transform-origin:222px 445px;animation:armL calc(var(--beat)*2) ease-in-out infinite}
  #armR{transform-origin:378px 445px;animation:armR calc(var(--beat)*2) ease-in-out infinite}
  @keyframes armL{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(115deg)}}
  @keyframes armR{0%,100%{transform:rotate(-115deg)}50%{transform:rotate(5deg)}}
  #tail{transform-origin:385px 480px;animation:tail calc(var(--beat)*2) ease-in-out infinite}
  @keyframes tail{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  #footL{transform-origin:252px 530px;animation:footL calc(var(--beat)*2) ease-in-out infinite}
  #footR{transform-origin:348px 530px;animation:footR calc(var(--beat)*2) ease-in-out infinite}
  @keyframes footL{0%,100%{transform:translateY(0)}25%{transform:translateY(-16px)}50%{transform:translateY(0)}}
  @keyframes footR{0%,50%{transform:translateY(0)}75%{transform:translateY(-16px)}100%{transform:translateY(0)}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.2s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  #mouth{transform-origin:300px 320px;animation:mouth calc(var(--beat)*2) ease-in-out infinite}
  @keyframes mouth{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.1)}}
  #belly{transform-box:fill-box;transform-origin:center;animation:duang calc(var(--beat)*2) ease-in-out infinite}
  @keyframes duang{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(1.07,.94)}}
  #shadow{transform-origin:300px 560px;animation:sh calc(var(--beat)*2) ease-in-out infinite}
  @keyframes sh{0%,50%,100%{transform:scale(1);opacity:.25}25%,75%{transform:scale(.78);opacity:.14}}
    #sprout{transform-origin:300px 150px;animation:sprout calc(var(--beat)*2) ease-in-out infinite}
  @keyframes sprout{0%,50%,100%{transform:rotate(0)}25%,75%{transform:rotate(7deg) scaleY(.94)}}
  #sound{position:absolute;top:2vh;right:3vw;font-size:26px;cursor:pointer;background:#fff8;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  @media (prefers-reduced-motion:reduce){#all{animation-duration:calc(var(--beat)*3)}}
</style>
</head>
<body>
<h1>小黄龙跳舞 🐉</h1>
<div id="sound" title="开/关声音">🔇</div>
<div id="stage">
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-label="小黄龙在跳舞">
  <defs>
    <radialGradient id="g" cx="38%" cy="28%" r="85%"><stop offset="0" stop-color="#ffec6e"/><stop offset=".55" stop-color="#ffd42a"/><stop offset="1" stop-color="#fbbf14"/></radialGradient>
    <radialGradient id="bellyG" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#ffe9cf"/><stop offset="1" stop-color="#ffcf9c"/></radialGradient>
    <radialGradient id="iris" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#c9fbe6"/><stop offset=".55" stop-color="#7fe5bd"/><stop offset="1" stop-color="#38b98e"/></radialGradient>
    <radialGradient id="spine" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#9be88a"/><stop offset="1" stop-color="#3fb85a"/></radialGradient>
    <radialGradient id="palm" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#ffb5b5"/><stop offset="1" stop-color="#ff8f9a"/></radialGradient>
    <!-- hand: mitten facing outward-down-left, pink palm, brown claw tips -->
    <g id="hand">
      <circle cx="160" cy="476" r="25" fill="url(#g)" stroke="#d9961c" stroke-width="3.5"/>
      <ellipse cx="164" cy="478" rx="13" ry="12" fill="url(#palm)"/>
      <circle cx="154" cy="468" r="4.5" fill="#ffa3ab"/><circle cx="150" cy="479" r="4.5" fill="#ffa3ab"/><circle cx="156" cy="490" r="4.5" fill="#ffa3ab"/>
      <ellipse cx="139" cy="466" rx="5.5" ry="3.8" fill="#8a5a2b" transform="rotate(-25 139 466)"/>
      <ellipse cx="135" cy="478" rx="5.5" ry="3.8" fill="#8a5a2b"/>
      <ellipse cx="140" cy="491" rx="5.5" ry="3.8" fill="#8a5a2b" transform="rotate(25 140 491)"/>
    </g>
    <g id="foot">
      <ellipse cx="0" cy="0" rx="44" ry="25" fill="url(#g)" stroke="#d9961c" stroke-width="3.5"/>
      <ellipse cx="0" cy="3" rx="19" ry="10" fill="url(#palm)"/>
      <circle cx="-14" cy="-3" r="4.5" fill="#ffa3ab"/><circle cx="0" cy="-6" r="4.5" fill="#ffa3ab"/><circle cx="14" cy="-3" r="4.5" fill="#ffa3ab"/>
      <ellipse cx="-24" cy="17" rx="5.5" ry="4" fill="#8a5a2b"/><ellipse cx="0" cy="22" rx="5.5" ry="4" fill="#8a5a2b"/><ellipse cx="24" cy="17" rx="5.5" ry="4" fill="#8a5a2b"/>
    </g>
  </defs>
  <ellipse id="shadow" cx="300" cy="560" rx="135" ry="15" fill="#8a5a1a"/>
  <g id="all">
    <!-- short thick tail, same yellow, blunt end, about one leg long -->
    <g id="tail"><path d="M375 458 Q440 462 478 502 Q494 526 470 531 Q428 533 380 508Z" fill="url(#g)" stroke="#d9961c" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="445" cy="490" rx="26" ry="8" fill="#fff6a8" opacity=".5" transform="rotate(30 445 490)"/></g>
    <g id="footL"><use href="#foot" x="252" y="530"/></g>
    <g id="footR"><use href="#foot" x="348" y="530"/></g>
    <g id="body">
      <ellipse cx="300" cy="442" rx="108" ry="92" fill="url(#g)" stroke="#d9961c" stroke-width="3.5"/>
      <g id="belly"><ellipse cx="300" cy="458" rx="80" ry="70" fill="url(#bellyG)" stroke="#f0b072" stroke-width="2.5"/>
        <ellipse cx="272" cy="425" rx="26" ry="11" fill="#fff" opacity=".55" transform="rotate(-25 272 425)"/></g>
    </g>
    <g id="head">
      <!-- tiny leaf sprout on top of the head -->
      <g id="sprout">
        <path d="M300 150 Q298 128 300 112" fill="none" stroke="#2f9a4a" stroke-width="6" stroke-linecap="round"/>
        <path d="M300 118 Q262 108 250 78 Q290 70 300 118Z" fill="url(#spine)" stroke="#2c8a45" stroke-width="3" stroke-linejoin="round"/>
        <path d="M300 116 Q338 100 352 66 Q310 62 300 116Z" fill="url(#spine)" stroke="#2c8a45" stroke-width="3" stroke-linejoin="round"/>
        <path d="M298 114 Q278 98 262 84" fill="none" stroke="#2c8a45" stroke-width="2" opacity=".6" stroke-linecap="round"/>
        <path d="M302 112 Q322 92 340 76" fill="none" stroke="#2c8a45" stroke-width="2" opacity=".6" stroke-linecap="round"/>
      </g>
      <ellipse cx="300" cy="275" rx="166" ry="141" fill="url(#g)" stroke="#d9961c" stroke-width="3.5"/>
      <ellipse cx="232" cy="190" rx="52" ry="22" fill="#fff" opacity=".4" transform="rotate(-28 232 190)"/>
      <!-- eyes: white sclera, green iris, dark pupil, highlight -->
      <g class="eye"><ellipse cx="262" cy="262" rx="31" ry="35" fill="#fff" stroke="#d9a43a" stroke-width="2.5"/>
        <circle cx="264" cy="266" r="22" fill="url(#iris)"/><circle cx="264" cy="266" r="12" fill="#173a33"/>
        <circle cx="272" cy="256" r="6.5" fill="#fff"/><circle cx="257" cy="275" r="3" fill="#fff" opacity=".9"/></g>
      <g class="eye"><ellipse cx="338" cy="262" rx="31" ry="35" fill="#fff" stroke="#d9a43a" stroke-width="2.5"/>
        <circle cx="336" cy="266" r="22" fill="url(#iris)"/><circle cx="336" cy="266" r="12" fill="#173a33"/>
        <circle cx="344" cy="256" r="6.5" fill="#fff"/><circle cx="329" cy="275" r="3" fill="#fff" opacity=".9"/></g>
      <!-- rosy cheeks -->
      <ellipse cx="208" cy="322" rx="24" ry="15" fill="#ff8fa3" opacity=".55"/><ellipse cx="392" cy="322" rx="24" ry="15" fill="#ff8fa3" opacity=".55"/>
      <ellipse cx="215" cy="316" rx="7" ry="3.5" fill="#fff" opacity=".5"/><ellipse cx="385" cy="316" rx="7" ry="3.5" fill="#fff" opacity=".5"/>
      <!-- no nose, no ears, no horns. mouth: small smile that opens into a big grin -->
      <g id="mouth"><path d="M254 318 Q300 334 346 318 Q342 370 300 370 Q258 370 254 318Z" fill="#8e2f35" stroke="#6b1d22" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <ellipse cx="300" cy="360" rx="26" ry="11" fill="#ff8f9a"/></g>
    </g>
    <g id="armL"><ellipse cx="196" cy="456" rx="42" ry="22" fill="url(#g)" stroke="#d9961c" stroke-width="3.5" transform="rotate(28 196 456)"/><use href="#hand"/></g>
    <g id="armR"><g transform="translate(600 0) scale(-1 1)"><ellipse cx="196" cy="456" rx="42" ry="22" fill="url(#g)" stroke="#d9961c" stroke-width="3.5" transform="rotate(28 196 456)"/><use href="#hand"/></g></g>
  </g>
</svg>
</div>
<div class="hint">点一下屏幕，听小黄龙打拍子 ♪<br><small style="opacity:.7;font-size:11px">原创小黄龙 · 像素风硬核节奏</small></div>
<script>
// floating decorations
const sym=['⭐','🎵','♥','✨','🎶','💛','★'];
function spawn(){
  const e=document.createElement('div');e.className='float';
  e.textContent=sym[Math.random()*sym.length|0];
  e.style.left=Math.random()*96+'vw';
  e.style.fontSize=(18+Math.random()*26)+'px';
  e.style.animationDuration=(6+Math.random()*6)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),12500);
}
setInterval(spawn,450);for(let i=0;i<8;i++)setTimeout(spawn,i*120);

// ---- dance sync: CSS dance animations all last 2 beats (--beat = 60000/95 ms); on start, phase-lock them to the audio clock ----
const BEAT=60000/95;
const DANCE=new Set(['hop','sway','nod','armL','armR','tail','footL','footR','mouth','duang','sh','sprout']);
function syncDance(){
  const ph=(ctx.currentTime-startT-(ctx.outputLatency||0))*1000;   // negative until the first downbeat
  document.getAnimations().forEach(a=>{if(DANCE.has(a.animationName))a.currentTime=ph});
}
// ?t=ms freezes the dance at that time (used for screenshots)
const frozen=new URLSearchParams(location.search).get('t');
if(frozen!==null)requestAnimationFrame(()=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=+frozen}));

// ---- Original 8-bit "hardcore" loop, synthesised live with WebAudio (no audio files) ----
// 95 BPM, A minor pentatonic, 8 bars: verse (Am Am F G) + variation (Am F G E).
// Pulse lead + triangle bass (8th notes) + noise drums, lookahead scheduler (25ms timer, 100ms ahead).
let ctx=null,on=false,timer=null,master=null,bus=null,noiseBuf=null,pulse25=null,pulse125=null;
let nextT=0,stepIdx=0,startT=0;
const BPM=95, S16=60/BPM/4, LOOK=0.1, TICK=25;      // S16 = one sixteenth note in seconds
const btn=document.getElementById('sound');
const BASS_ROOT=[45,45,41,43, 45,41,43,40];         // A A F G | A F G E  (A2 F2 G2 E2)
const BASS_OFS=[0,0,12,0, 0,7,12,0];                // one entry per eighth note
const LEAD=[ // [sixteenth step, midi note, length in sixteenths] per bar
  [[0,76,2],[3,76,1],[4,79,2],[7,76,1],[8,74,2],[10,72,2],[12,74,4]],
  [[0,72,2],[3,72,1],[4,74,2],[7,72,1],[8,69,4],[12,72,2],[14,74,2]],
  [[0,74,2],[3,74,1],[4,76,2],[7,74,1],[8,72,2],[10,69,2],[12,72,4]],
  [[0,79,2],[3,76,1],[4,74,2],[7,76,1],[8,79,4],[12,76,2],[14,74,2]],
  [[0,81,2],[2,79,1],[3,76,1],[4,79,2],[6,76,2],[8,74,2],[10,76,2],[12,79,2],[14,81,2]],
  [[0,81,2],[2,79,1],[3,76,1],[4,74,2],[6,72,2],[8,74,1],[9,72,1],[10,69,2],[12,72,4]],
  [[0,79,2],[2,81,1],[3,79,1],[4,76,2],[6,74,2],[8,76,1],[9,79,1],[10,81,2],[12,79,2],[14,76,2]],
  [[0,76,2],[2,79,2],[4,76,2],[6,74,2],[8,72,2],[10,74,2],[12,76,4]]
];
const leadAt={};LEAD.forEach((bar,b)=>bar.forEach(n=>{leadAt[b*16+n[0]]=n}));
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mkPulse(d){const N=48,re=new Float32Array(N+1),im=new Float32Array(N+1);
  for(let n=1;n<=N;n++)re[n]=2/(n*Math.PI)*Math.sin(n*Math.PI*d);
  return ctx.createPeriodicWave(re,im)}
function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.2;
  master=ctx.createGain();master.gain.value=0;           // target 0.25 when playing
  bus=ctx.createGain();bus.gain.value=1;
  bus.connect(comp);comp.connect(master);master.connect(ctx.destination);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  pulse25=mkPulse(.25);pulse125=mkPulse(.125);
}
function env(g,t,v,a,d){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+d)}
function osc(wave,f,t,dur,v,sustain){           // pulse/triangle voice with short attack and release
  const o=ctx.createOscillator(),g=ctx.createGain();
  if(wave instanceof PeriodicWave)o.setPeriodicWave(wave);else o.type=wave;
  o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);
  g.gain.setValueAtTime(v*sustain,t+Math.max(.01,dur-.04));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(bus);o.start(t);o.stop(t+dur+.02);
}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);
  o.connect(g).connect(bus);o.start(t);o.stop(t+.22)}
function noise(t,dur,v,type,freq){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=noiseBuf;s.loop=true;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(bus);s.start(t,Math.random()*.5);s.stop(t+dur+.01)}
function playStep(i,t){
  const bar=(i>>4)%8, s=i&15;
  // lead (pulse): 25% duty for the verse, thinner 12.5% for the variation
  const n=leadAt[bar*16+s];
  if(n)osc(bar<4?pulse25:pulse125,mtof(n[1]),t,n[2]*S16*.92,bar<4?.16:.14,.6);
  // bass (triangle), eighth notes
  if(!(s&1)){const m=BASS_ROOT[bar]+BASS_OFS[s>>1];osc('triangle',mtof(m),t,S16*1.8,.5,.8)}
  // drums (noise channel + kick)
  if(s%4===0)kick(t);
  if(s===4||s===12)noise(t,.14,.35,'bandpass',1800);
  if((bar===3||bar===7)&&s>=14)noise(t,.08,.25,'bandpass',2200);          // fill at end of each half
  noise(t,s%4===0?.05:.03,s%4===0?.09:.05,'highpass',7000);               // 16th hi-hat, accented on the beat
}
function scheduler(){
  while(nextT<ctx.currentTime+LOOK){playStep(stepIdx,nextT);nextT+=S16;stepIdx=(stepIdx+1)%128}
}
function toggle(e){
  if(e)e.stopPropagation();
  if(!ctx)initAudio();
  on=!on;btn.textContent=on?'🔊':'🔇';
  if(on){
    ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(.25,ctx.currentTime+.05);
    stepIdx=0;nextT=startT=ctx.currentTime+.06;      // bar 1 beat 1 lands exactly on startT -> dance syncs to it
    scheduler();timer=setInterval(scheduler,TICK);syncDance();
  }else{
    clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(0,ctx.currentTime+.08);
  }
}
document.body.addEventListener('click',()=>{ if(!on) toggle(); });
btn.addEventListener('click',toggle);

</script>
</body>
</html>
